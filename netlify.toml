[build]
  command = "npm run build"
  publish = "dist"
  # exit 0 = build overslaan: alleen .md in de root, .github/ of .vscode/ gewijzigd (zie _standards/DEPLOY.md).
  # `glob`: *.md matcht alleen de root, zodat Markdown-content in lagado-content/ wel een build start.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude,glob)*.md' ':(exclude).github/' ':(exclude).vscode/'"

[build.environment]
  NODE_VERSION = "22"
  # FONTS_URL is geen geheim (staat in de README); FONTS_TOKEN wordt wel gescand.
  SECRETS_SCAN_OMIT_KEYS = "FONTS_URL"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts hebben geen hash in de naam: een week cachen, niet immutable.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Oude menu-URL's (Wat/Waarom → Projecten/Over), zodat bestaande links blijven werken.
[[redirects]]
  from = "/wat"
  to = "/projecten"
  status = 301

[[redirects]]
  from = "/wat/*"
  to = "/projecten/:splat"
  status = 301

[[redirects]]
  from = "/waarom"
  to = "/over"
  status = 301

